<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scene Pixel Art</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <canvas id="gameCanvas"></canvas>
    <aside class="music-player" aria-label="Lecteur de musique">
      <div class="music-cover" aria-hidden="true">NCS</div>
      <div class="music-info">
        <p class="music-kicker">Now playing</p>
        <p class="music-title">springs! - Magnetic</p>
        <p class="music-subtitle">NCS Release</p>
      </div>
      <button id="musicToggle" class="music-toggle" type="button" aria-label="Couper la musique">
        ON
      </button>
      <label class="volume-control" for="musicVolume">
        <span>Vol</span>
        <input id="musicVolume" type="range" min="0" max="1" step="0.01" value="0.05" tabindex="-1" />
      </label>
    </aside>
    <audio id="backgroundMusic" src="springs!.mp3" loop preload="auto"></audio>
    <script src="main.js"></script>
  </body>
</html>
